<meta name="twitter:card" content="summary_large_image">
<script>
  (function () {
    var langs = ["ko","en","ja","th","es"];
    var pick = (navigator.languages || [navigator.language || "en"]).map(function (l) { return l.slice(0, 2).toLowerCase(); }).find(function (l) { return langs.indexOf(l) >= 0; });
    location.replace("/" + (pick || "en") + "/");
  })();
</script>
